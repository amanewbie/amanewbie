<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <title>NOVA AI</title>
  <style>
    :root{color-scheme:dark;--bg:#090b12;--panel:#10131d;--panel2:#171b28;--line:#252b3b;--text:#f4f6ff;--muted:#9299ad;--accent:#8b7cff;--accent2:#55d6c2}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh;overflow:hidden}
    button,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0}
    .app{height:100dvh;display:grid;grid-template-columns:270px 1fr}
    aside{background:#0d1018;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:16px;min-height:0}
    .brand{display:flex;align-items:center;gap:11px;padding:4px 6px 16px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(140deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#080b13;font-weight:900;font-size:20px;box-shadow:0 6px 28px #8b7cff35}.brand strong{font-size:17px;letter-spacing:.12em}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em}
    .new{width:100%;padding:12px;border:1px solid #48416f;background:#1b1930;border-radius:12px;text-align:left;font-weight:650}.new:hover,.suggestion:hover{background:#24213e}
    .side-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em;padding:8px 7px 0}.history{overflow:auto;display:flex;flex-direction:column;gap:5px}.history button{background:transparent;text-align:left;padding:9px 10px;border-radius:9px;color:#c5cad8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button.active,.history button:hover{background:var(--panel2);color:white}
    .side-bottom{margin-top:auto;color:var(--muted);font-size:12px;padding:10px 7px}.status{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;background:var(--accent2);border-radius:50%}
    main{min-width:0;display:flex;flex-direction:column;position:relative}.topbar{height:64px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px}.topbar-title{font-weight:650}.top-actions{display:flex;gap:8px}.iconbtn{width:37px;height:37px;border:1px solid var(--line);background:var(--panel);border-radius:11px;display:grid;place-items:center}.iconbtn:hover{border-color:#625b91}
    .mobile-brand{display:none;align-items:center;gap:9px;font-weight:800;letter-spacing:.1em}.mobile-brand .logo{width:31px;height:31px;font-size:16px}
    .chat{flex:1;overflow:auto;padding:35px 18px 25px}.inner{max-width:780px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}.welcome{margin:auto 0;text-align:center;padding:35px 0 45px}.welcome-mark{width:62px;height:62px;margin:0 auto 20px;border-radius:21px;background:linear-gradient(140deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#080b13;font-size:29px;font-weight:900;box-shadow:0 12px 45px #8b7cff25}.welcome h1{font-size:clamp(28px,5vw,42px);line-height:1.15;margin:0 0 12px;letter-spacing:-.04em}.welcome p{color:var(--muted);margin:0 auto 28px;max-width:430px}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:570px;margin:auto}.suggestion{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;text-align:left;color:#dce0ec;font-size:13px}
    .messages{display:flex;flex-direction:column;gap:22px;padding-bottom:20px}.message{display:flex;gap:12px;align-items:flex-start;max-width:100%}.avatar{width:31px;height:31px;flex:0 0 31px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--panel2);color:var(--accent2)}.message.user .avatar{background:#282341;color:#c6bdff}.bubble{min-width:0;max-width:calc(100% - 43px);padding:3px 0;color:#e8eaf2;white-space:pre-wrap;overflow-wrap:anywhere}.message.user .bubble{background:#171b28;border:1px solid var(--line);padding:11px 14px;border-radius:4px 14px 14px 14px}.message.error .bubble{color:#ff9c9c}.typing{color:var(--muted);font-size:13px}
    .composer-wrap{padding:12px 18px max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 18%)}.composer{max-width:780px;margin:auto;background:var(--panel);border:1px solid #30364a;border-radius:17px;padding:10px;display:flex;align-items:flex-end;gap:10px;box-shadow:0 12px 45px #0005}.composer:focus-within{border-color:#6c62a8}.composer textarea{flex:1;resize:none;max-height:160px;min-height:27px;background:transparent;border:0;outline:0;color:var(--text);padding:5px 4px;line-height:1.5}.composer textarea::placeholder{color:#777f95}.send{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--accent);color:#080914;font-weight:900;font-size:18px}.send:disabled{opacity:.4;cursor:not-allowed}.fineprint{text-align:center;color:#6f778b;font-size:10px;padding-top:9px}
    @media(max-width:700px){.app{grid-template-columns:1fr}aside{display:none}.topbar{height:58px;padding:0 15px}.mobile-brand{display:flex}.topbar-title{display:none}.chat{padding:20px 15px}.welcome{padding:20px 0 35px}.suggestions{grid-template-columns:1fr}.suggestion{padding:11px}.composer-wrap{padding-left:12px;padding-right:12px}.bubble{font-size:14px}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">N</div><div><strong>NOVA AI</strong><small>YOUR AI ASSISTANT</small></div></div>
    <button class="new" id="newChat">＋ &nbsp; New chat</button>
    <div class="side-label">Recent chats</div>
    <div class="history" id="history"></div>
    <div class="side-bottom"><div class="status"><span class="dot"></span> NOVA is ready</div><div style="margin-top:8px">A little intelligence, a lot of possibility.</div></div>
  </aside>
  <main>
    <header class="topbar">
      <div class="mobile-brand"><div class="logo">N</div>NOVA AI</div>
      <div class="topbar-title" id="chatTitle">New conversation</div>
      <div class="top-actions"><button class="iconbtn" id="newMobile" aria-label="New chat" title="New chat">＋</button></div>
    </header>
    <section class="chat" id="chat">
      <div class="inner">
        <div class="welcome" id="welcome">
          <div class="welcome-mark">N</div>
          <h1>What can I help with?</h1>
          <p>Ask anything. Explore ideas, solve problems, write code, or just think out loud.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Explain a difficult topic in a simple way.">✦ Explain something</button>
            <button class="suggestion" data-prompt="Help me brainstorm a creative project.">✧ Brainstorm ideas</button>
            <button class="suggestion" data-prompt="Help me write a JavaScript function.">⌘ Help me code</button>
            <button class="suggestion" data-prompt="Give me a few interesting facts about space.">◎ Explore a topic</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </div>
    </section>
    <div class="composer-wrap">
      <form class="composer" id="form">
        <textarea id="input" rows="1" placeholder="Message NOVA..." autocomplete="off"></textarea>
        <button class="send" id="send" aria-label="Send message">↑</button>
      </form>
      <div class="fineprint">NOVA can make mistakes. Check important information.</div>
    </div>
  </main>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const input = $("input"), messagesEl = $("messages"), welcome = $("welcome");
  let chats = JSON.parse(localStorage.getItem("nova_chats") || "[]");
  let activeId = null, busy = false;

  function save(){ localStorage.setItem("nova_chats", JSON.stringify(chats)); renderHistory(); }
  function current(){ return chats.find(c => c.id === activeId); }
  function newChat(){
    activeId = null; messagesEl.innerHTML = ""; welcome.hidden = false;
    $("chatTitle").textContent = "New conversation"; renderHistory(); input.focus();
  }
  function renderHistory(){
    $("history").innerHTML = "";
    [...chats].reverse().forEach(c => {
      const b = document.createElement("button"); b.textContent = c.title || "New chat";
      b.className = c.id === activeId ? "active" : "";
      b.onclick = () => openChat(c.id); $("history").appendChild(b);
    });
  }
  function openChat(id){
    activeId = id; const c = current(); if(!c) return;
    messagesEl.innerHTML = ""; welcome.hidden = c.messages.length > 0;
    c.messages.forEach(m => addMessage(m.role,m.content));
    $("chatTitle").textContent = c.title; renderHistory();
    $("chat").scrollTop = $("chat").scrollHeight;
  }
  function addMessage(role, content, error=false){
    const wrap = document.createElement("div"); wrap.className = "message " + role + (error ? " error" : "");
    const avatar = document.createElement("div"); avatar.className = "avatar"; avatar.textContent = role === "user" ? "Y" : "N";
    const bubble = document.createElement("div"); bubble.className = "bubble"; bubble.textContent = content;
    wrap.append(avatar,bubble); messagesEl.appendChild(wrap);
    $("chat").scrollTop = $("chat").scrollHeight; return bubble;
  }
  async function sendMessage(text){
    text = text.trim(); if(!text || busy) return;
    if(!activeId){ activeId = String(Date.now()); chats.push({id:activeId,title:text.slice(0,34),messages:[]}); }
    const c = current(); c.messages.push({role:"user",content:text});
    welcome.hidden = true; $("chatTitle").textContent = c.title;
    addMessage("user",text); save(); input.value = ""; resizeInput();
    busy = true; $("send").disabled = true;
    const typing = addMessage("assistant","NOVA is thinking…"); typing.classList.add("typing");
    try{
      const response = await fetch("/api/chat",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:c.messages.slice(-20)})
      });
      const data = await response.json();
      if(!response.ok) throw new Error(data.error || "Something went wrong.");
      typing.textContent = data.reply;
      c.messages.push({role:"assistant",content:data.reply}); save();
    }catch(err){
      typing.textContent = err.message; typing.parentElement.classList.add("error");
    }finally{ busy = false; $("send").disabled = false; input.focus(); }
  }
  function resizeInput(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,160)+"px"; }
  $("form").addEventListener("submit",e=>{e.preventDefault();sendMessage(input.value);});
  input.addEventListener("input",resizeInput);
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit();}});
  $("newChat").onclick = newChat; $("newMobile").onclick = newChat;
  document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>sendMessage(b.dataset.prompt));
  renderHistory();
</script>
</body>
</html>
